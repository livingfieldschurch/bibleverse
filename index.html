<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244a36">
  <meta name="description" content="Living Fields Church weekly Bible memory verses.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>Living Fields Church — Bible Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="living-fields-logo.png" alt="Living Fields Church" class="logo">
    <div class="church-name">
      <span class="brand-title">LIVING FIELDS</span>
      <small>Bible Memory Verse</small>
    </div>
  </div>

<button id="shareAppBtn" class="share-icon" aria-label="Share app">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="18" cy="5" r="2"></circle>
    <circle cx="6" cy="12" r="2"></circle>
    <circle cx="18" cy="19" r="2"></circle>
    <line x1="8" y1="12" x2="16" y2="6"></line>
    <line x1="8" y1="12" x2="16" y2="18"></line>
  </svg>
</button>

  <button id="installBtn" class="install">Install App</button>
</header>

<main>
    <section class="hero">
      <p class="eyebrow" id="weekLabel">LIVING FIELDS CHURCH · THIS WEEK</p>
      <h1 id="title">Bible Memory Verse</h1>
      <p class="topic" id="topic"></p>
      <blockquote id="verse"></blockquote>
      <p class="reference" id="reference"></p>
     <div class="verse-actions">
  <button id="questionsBtn" class="primary">Bible Verse Questions</button>
  <button id="reminderBtn" class="primary">Enable daily reminders</button>
</div>
      
    </section>

    <section class="quick">
      <button id="prevBtn">← Previous</button>
      <button id="todayBtn">This week</button>
      <button id="nextBtn">Next →</button>
    </section>

    <section class="history">
      <div class="section-head">
        <div>
          <p class="eyebrow">VERSE LIBRARY</p>
          <h2>Previous verses</h2>
        </div>
        <input id="search" type="search" placeholder="Search verses…" aria-label="Search verses">
      </div>
      <div id="list"></div>
    </section>
  </main>

  <footer>
    <span>Weekly Bible Memory</span>
    <span>•</span>
    <span id="year"></span>
  </footer>

<script src="verses.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentIndex = 0;
let deferredPrompt = null;

function dayOfYear(month, day, year) {
  return Math.floor((new Date(year, month - 1, day) - new Date(year, 0, 0)) / 86400000);
}

function currentIndexForToday() {
  const now = new Date();
  const target = dayOfYear(now.getMonth()+1, now.getDate(), now.getFullYear());
  let best = 0, bestDiff = Infinity;
  VERSES.forEach((v, i) => {
    const d = dayOfYear(v.month, v.day, now.getFullYear());
    let diff = target - d;
    if (diff < 0) diff += 365 + (new Date(now.getFullYear(), 1, 29).getMonth() === 1 ? 1 : 0);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return best;
}

function display(i) {
  currentIndex = (i + VERSES.length) % VERSES.length;
  const v = VERSES[currentIndex];
  const now = new Date();
  const date = new Date(now.getFullYear(), v.month - 1, v.day);
  $("weekLabel").textContent = currentIndex === currentIndexForToday() ? "THIS WEEK" : "MEMORY VERSE";
  $("title").textContent = v.title.replace(/^I\.\s+|^II\.\s+|^III\.\s+|^IV\.\s+|^V\.\s+/, "");
  const pieces = v.title.split(":");
  $("topic").textContent = v.title.replace(/^[IVX]+\.\s*/, "").trim();  
  $("verse").textContent = v.verse.replace(/\s+(?:[1-3]\s)?[A-Za-z]+(?:\s+[A-Za-z]+)*\s+\d+(?::\s?\d+(?:-\d+)?)?$/, "");
  $("reference").textContent = referenceFromVerse(v.verse);
  $("questionsBtn").onclick = () => showQuestions(v);
  renderList();
  window.scrollTo({top:0, behavior:"smooth"});
}

function referenceFromVerse(verse) {
  const refs = {
    "Matthew 4:19":"Matthew 4:19","Romans 3:23":"Romans 3:23","Romans 6:23":"Romans 6:23",
    "Romans 5:8":"Romans 5:8","Ephesians 2:8-9":"Ephesians 2:8-9","John 1:12":"John 1:12",
    "1 John 5:13":"1 John 5:13","1 Corinthians 3:16":"1 Corinthians 3:16","Isaiah 41:10":"Isaiah 41:10",
    "Lamentations 3:22-23":"Lamentations 3:22-23","Isaiah 26:3":"Isaiah 26:3","Romans 8:32":"Romans 8:32",
    "Hebrews 2:18":"Hebrews 2:18","Matthew 6:33":"Matthew 6:33","1 John 2:15-16":"1 John 2:15-16",
    "1 Corinthians 15:58":"1 Corinthians 15:58","Mark 10:45":"Mark 10:45","Proverbs 3:9-10":"Proverbs 3:9-10",
    "Acts 1:8":"Acts 1:8","John 13:34-35":"John 13:34-35","Philippians 2:3-4":"Philippians 2:3-4",
    "Ephesians 5:3":"Ephesians 5:3","Leviticus 19:11":"Leviticus 19:11","Hebrews 11:6":"Hebrews 11:6",
    "Galatians 6:9-10":"Galatians 6:9-10","Galatians 2:20":"Galatians 2:20","Romans 12:1":"Romans 12:1",
    "2 Timothy 3:16":"2 Timothy 3:16","Philippians 4:6-7":"Philippians 4:6-7","Hebrews 10:24-25":"Hebrews 10:24-25",
    "Romans 1:16":"Romans 1:16","Isaiah 53:6":"Isaiah 53:6","Hebrews 9:27":"Hebrews 9:27",
    "1 Peter 3:18":"1 Peter 3:18","Titus 3:5":"Titus 3:5","Revelation 3:20":"Revelation 3:20",
    "John 5:24":"John 5:24","1 Corinthians 2:12":"1 Corinthians 2:12","Philippians 4:13":"Philippians 4:13",
    "Numbers 23:19":"Numbers 23:19","1 Peter 5:7":"1 Peter 5:7","Philippians 4:19":"Philippians 4:19",
    "Psalm 119: 9,11":"Psalm 119:9, 11","Luke 9:23":"Luke 9:23","Romans 12:2":"Romans 12:2",
    "Hebrews 12:3":"Hebrews 12:3","2 Corinthians 4:5":"2 Corinthians 4:5","2 Corinthians 9:6-7":"2 Corinthians 9:6-7",
    "Matthew 28:19-20":"Matthew 28:19-20","1 John 3:18":"1 John 3:18","1 Peter 5:5-6":"1 Peter 5:5-6",
    "1 Peter 2:11":"1 Peter 2:11"
  };
  const found = Object.keys(refs).find(r => verse.includes(r));
  return found ? refs[found] : "";
}

function renderList() {
  const q = $("search").value.toLowerCase().trim();
  $("list").innerHTML = VERSES.map((v,i) => ({v,i}))
    .filter(x => !q || JSON.stringify(x.v).toLowerCase().includes(q))
    .map(({v,i}) => {
      const active = i === currentIndex ? " active" : "";
      const date = new Date(2026, v.month-1, v.day).toLocaleDateString(undefined,{month:"short",day:"numeric"});
      return `<button class="verse-row${active}" onclick="display(${i})">
        <span class="date">${date}</span>
        <span class="row-main"><strong>${escapeHtml(v.title.split(":").pop().trim())}</strong><small>${escapeHtml(v.verse)}</small></span>
      </button>`;
    }).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function shareVerse(v) {
  const text = `${v.verse}\n${referenceFromVerse(v.verse)}`;
  if (navigator.share) {
    await navigator.share({title:"Bible Memory Verse", text});
  } else {
    await navigator.clipboard.writeText(text);
  }
}

async function shareApp() {
  const url = "https://livingfieldschurch.github.io/bibleverse/";

  if (navigator.share) {
    await navigator.share({
      title: "Living Fields Bible Memory",
      text: "Check out Living Fields Bible Memory",
      url
    });
  } else {
    await navigator.clipboard.writeText(url);
    alert("App link copied!");
  }
}

function showQuestions(v) {
  const questions = v.questions || [];

  alert(
    "Bible Verse Questions\n\n" +
    questions.map((q, i) => `${i + 1}. ${q}`).join("\n\n")
  );
}

$("prevBtn").onclick = () => display(currentIndex - 1);
$("nextBtn").onclick = () => display(currentIndex + 1);

$("shareAppBtn").onclick = () => shareApp();

$("reminderBtn").onclick = async () => {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Push notifications are not supported in this browser.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      alert("Notifications were not enabled.");
      return;
    }

    const registration = await navigator.serviceWorker.ready;

    const keyResponse = await fetch(
  "https://living-fields-reminders-app.livingfields.workers.dev/vapid-public-key"
);

    const { publicKey } = await keyResponse.json();

    const applicationServerKey = urlBase64ToUint8Array(publicKey);

    let subscription =
      await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey
      });
    }

    const saveResponse = await fetch(
      "https://living-fields-reminders-app.livingfields.workers.dev/subscribe",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(subscription)
      }
    );

    const result = await saveResponse.json();

    if (!result.ok) {
      throw new Error(result.error || "Could not save subscription.");
    }

    $("reminderBtn").textContent = "Daily reminders enabled ✓";
    $("reminderBtn").disabled = true;

  } catch (error) {
    console.error(error);
alert("Reminder error: " + error.message);
  }
};
let deferredInstallPrompt = null;

const installBtn = $("installBtn");

// Hide the button when the site is already running as an installed app
const isInstalled =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

if (isInstalled) {
  installBtn.style.display = "none";
}

// Save the browser's install prompt when available
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

installBtn.addEventListener("click", async () => {
  // If the browser supports its own install prompt
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();

    const choice = await deferredInstallPrompt.userChoice;

    if (choice.outcome === "accepted") {
      installBtn.style.display = "none";
    }

    deferredInstallPrompt = null;
    return;
  }

  // Instructions for iPhone/iPad and browsers without an install prompt
  alert(
    "To install Living Fields Bible Memory:\n\n" +
    "iPhone/iPad:\n" +
    "1. Open this page in Safari.\n" +
    "2. Tap the Share button.\n" +
    "3. Choose 'Add to Home Screen'.\n" +
    "4. Tap 'Add'.\n\n" +
    "Other devices:\n" +
    "Open your browser menu and choose 'Install app' or 'Add to Home Screen'."
  );
});

// Hide the button if the browser reports that installation completed
window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
});

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat(
    (4 - (base64String.length % 4)) % 4
  );

  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(character => character.charCodeAt(0))
  );
}
  
$("todayBtn").onclick = () => display(currentIndexForToday());
$("search").oninput = renderList;
$("year").textContent = new Date().getFullYear();

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e; $("installBtn").classList.remove("hidden");
});
$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  $("installBtn").classList.add("hidden");
};

display(currentIndexForToday());

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
